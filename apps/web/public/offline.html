<!DOCTYPE html>
<html lang="bn" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0E0C0D" />
    <title>AGOMONI — অফলাইন মোড</title>
    <link rel="icon" type="image/svg+xml" href="/icons/durga-eye.svg" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        background-color: #0E0C0D;
        color: #FFF8EC;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Serif Bengali', serif, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        position: relative;
        overflow: hidden;
      }

      /* Ambient Puja Glow */
      .glow-bg {
        position: absolute;
        width: 320px;
        height: 320px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(181, 18, 24, 0.25) 0%, rgba(212, 175, 55, 0.1) 60%, transparent 80%);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -60%);
        pointer-events: none;
        animation: pulse 4s ease-in-out infinite alternate;
      }

      @keyframes pulse {
        0% { transform: translate(-50%, -60%) scale(0.95); opacity: 0.7; }
        100% { transform: translate(-50%, -60%) scale(1.08); opacity: 1; }
      }

      .card {
        position: relative;
        z-index: 10;
        max-width: 440px;
        width: 100%;
        background: rgba(26, 10, 12, 0.75);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(212, 175, 55, 0.35);
        border-radius: 20px;
        padding: 36px 24px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(212, 175, 55, 0.1);
      }

      .logo-ring {
        width: 84px;
        height: 84px;
        margin: 0 auto 20px;
        border-radius: 50%;
        border: 1.5px solid #D4AF37;
        padding: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(14, 12, 13, 0.8);
        box-shadow: 0 0 25px rgba(212, 175, 55, 0.3);
      }

      .logo-ring img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .flower {
        font-size: 28px;
        margin-bottom: 8px;
        display: inline-block;
      }

      h1 {
        font-size: 22px;
        font-weight: 700;
        color: #FFF8EC;
        margin-bottom: 12px;
        line-height: 1.4;
      }

      p.bn {
        font-size: 15px;
        color: #F5E6C8;
        opacity: 0.9;
        margin-bottom: 10px;
        line-height: 1.6;
      }

      p.en {
        font-size: 13px;
        color: #E8D4B0;
        opacity: 0.7;
        margin-bottom: 28px;
      }

      .retry-btn {
        background: linear-gradient(135deg, #B51218 0%, #8E0D12 100%);
        color: #FFF8EC;
        font-weight: 600;
        font-size: 16px;
        padding: 13px 32px;
        border-radius: 9999px;
        border: 1px solid rgba(212, 175, 55, 0.6);
        box-shadow: 0 4px 14px rgba(181, 18, 24, 0.4), 0 0 10px rgba(212, 175, 55, 0.2);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: all 0.2s ease;
      }

      .retry-btn:hover {
        background: linear-gradient(135deg, #D1261F 0%, #B51218 100%);
        transform: translateY(-1px);
        box-shadow: 0 6px 18px rgba(181, 18, 24, 0.6);
      }

      .retry-btn:active {
        transform: translateY(1px);
      }

      .status-pill {
        margin-top: 24px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: #E7C766;
        background: rgba(42, 11, 11, 0.6);
        padding: 4px 12px;
        border-radius: 12px;
        border: 1px solid rgba(212, 175, 55, 0.2);
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #FFA8A8;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div class="glow-bg"></div>
    <div class="card">
      <div class="logo-ring">
        <img src="/icons/durga-eye.svg" alt="AGOMONI" />
      </div>
      <div><span class="flower">🌸</span></div>
      <h1>পুজোর পথটা একটু থেমে গেছে...</h1>
      <p class="bn">ইন্টারনেট সংযোগ ফিরে এলে আবার চেষ্টা করুন। মা দুর্গার কৃপায় আগমনী সবসময় আপনার সঙ্গেই থাকবে।</p>
      <p class="en">You appear to be offline. AGOMONI will reconnect automatically once network is restored.</p>
      <div style="display: flex; flex-direction: column; gap: 10px; align-items: center; margin-top: 6px;">
        <button class="retry-btn" onclick="retryConnection()">
          <span>পুনরায় চেষ্টা করুন</span> • <span>Try Again</span>
        </button>
        <a href="/" style="display: inline-block; margin-top: 6px; font-size: 13px; color: #E7C766; text-decoration: none; border-bottom: 1px dashed rgba(212, 175, 55, 0.4); padding-bottom: 2px;">
          মূল পাতায় ফিরে যান • Return to Home
        </a>
      </div>
      <div>
        <div class="status-pill">
          <span class="dot" id="statusDot"></span>
          <span id="statusText">অফলাইন (Offline)</span>
        </div>
      </div>
    </div>

    <script>
      function updateAndReload() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            return Promise.all(regs.map(function(r) { return r.update(); }));
          }).then(function() {
            window.location.reload();
          }).catch(function() {
            window.location.reload();
          });
        } else {
          window.location.reload();
        }
      }

      function retryConnection() {
        if (navigator.onLine) {
          updateAndReload();
        } else {
          const btn = document.querySelector('.retry-btn');
          btn.style.opacity = '0.7';
          btn.innerText = 'সংযোগ খোঁজা হচ্ছে... (Checking...)';
          setTimeout(() => {
            btn.style.opacity = '1';
            btn.innerHTML = '<span>পুনরায় চেষ্টা করুন</span> • <span>Try Again</span>';
            if (navigator.onLine) updateAndReload();
          }, 1200);
        }
      }

      // If online already, attempt to update service worker in the background
      if (navigator.onLine && 'serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.update(); });
        });
      }

      window.addEventListener('online', () => {
        const dot = document.getElementById('statusDot');
        const text = document.getElementById('statusText');
        if (dot) dot.style.backgroundColor = '#10B981';
        if (text) text.innerText = 'অনলাইন সংযোগ ফিরেছে! লোড হচ্ছে...';
        setTimeout(() => {
          updateAndReload();
        }, 800);
      });
    </script>
  </body>
</html>
