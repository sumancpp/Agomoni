    <div id="root" class="relative min-h-screen flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service Worker management: prevent stale caching in local development
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        const isLocalhost = Boolean(
          window.location.hostname === 'localhost' ||
          window.location.hostname === '[::1]' ||
          window.location.hostname.match(/^127(?:\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)){3}$/)
        );

        if (isLocalhost) {
          // In development (npm run dev), actively remove all service workers and flush cache storage
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const registration of registrations) {
              registration.unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then((keys) => {
              for (const key of keys) {
                caches.delete(key);
              }
            });
          }
        } else {
          // In production, register PWA service worker
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(() => {
              // Service worker registration error handled silently in client
            });
          });
        }
      }
    </script>
  </body>
